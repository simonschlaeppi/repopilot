name: Build and push to ECR

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: repopilot-backend

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::403874533335:role/github-actions-repopilot
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:${{ github.sha }} -t $REGISTRY/$ECR_REPOSITORY:latest .
          docker push $REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to ECS Express Mode
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          SERVICE_ARN: arn:aws:ecs:eu-central-1:403874533335:service/default/repopilot-backend
          SECRET_ARN: arn:aws:secretsmanager:eu-central-1:403874533335:secret:repopilot/openai-api-key-x1YAoX
        run: |
          aws ecs update-express-gateway-service \
            --service-arn "$SERVICE_ARN" \
            --primary-container "{\"image\":\"$IMAGE\",\"containerPort\":8000,\"secrets\":[{\"name\":\"OPENAI_API_KEY\",\"valueFrom\":\"$SECRET_ARN\"}]}" \
            --region "$AWS_REGION"