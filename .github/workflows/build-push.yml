name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    uses: simonschlaeppi/mini-idp-workflows/.github/workflows/container-deploy.yml@f5e78d9a0ac129e85e527ac65caf4aaed9564d0e
    with:
      role-to-assume: arn:aws:iam::403874533335:role/github-actions-repopilot
      ecr-repository: repopilot-backend
      service-name: repopilot-backend
      install-command: pip install -r requirements.txt -r requirements-dev.txt
      test-command: OPENAI_API_KEY=dummy-for-tests python -m pytest
      secret-env-name: OPENAI_API_KEY
      secret-arn: arn:aws:secretsmanager:eu-central-1:403874533335:secret:repopilot/openai-api-key-x1YAoX
      deploy-enabled: ${{ vars.DEPLOY_ENABLED == 'true' }}